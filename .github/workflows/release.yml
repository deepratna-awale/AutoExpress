name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
      - 'v*.*.*-*'  # Also triggers on pre-release tags like v1.0.0-beta, v1.0.0-rc1

permissions:
  contents: read

jobs:
  # Build platform-specific releases
  build-windows:
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: read
    with:
      tag_name: ${{ github.ref_name }}
  
  build-linux:
    uses: ./.github/workflows/linux-release.yml
    permissions:
      contents: read
    with:
      tag_name: ${{ github.ref_name }}
  
  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
      
      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Check if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.tag.outputs.tag }}" =~ -.*$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Write release notes
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -vx "$TAG" | head -n 1)

          # The release notes are the CHANGELOG.md section headed "## <version>".
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " version " ") == 1 || $0 == "## " version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

          {
            cat section.md
            echo
            echo "### Downloads"
            echo
            echo "- **ComfyUI**: install AutoExpress from ComfyUI-Manager or the [Comfy Registry](https://registry.comfy.org/nodes/autoexpress)."
            echo "- **AUTOMATIC1111 / Forge / reForge / SD.Next**: Extensions > Install from URL, paste \`https://github.com/deepratna-awale/AutoExpress\`."
            echo "- **Standalone app, Windows**: download \`autoexpress-$TAG-Windows_Release.zip\`, extract it and run \`run.bat\`."
            echo "- **Standalone app, Linux**: download \`autoexpress-$TAG-Linux_Release.zip\`, extract it and run \`./run.sh\`."
            echo "- **Standalone app, Docker**: \`docker run -p 5000:5000 ghcr.io/deepratna-awale/autoexpress:$VERSION\`"
            echo "- **From source**: see the [README](https://github.com/deepratna-awale/AutoExpress#readme)."
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full changelog**: https://github.com/deepratna-awale/AutoExpress/compare/$PREV_TAG...$TAG"
            fi
          } > release_notes.md

          echo "changelog_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create source code archive
        run: |
          # Create a clean archive without .git, __pycache__, etc.
          mkdir -p artifacts
          git archive --format=zip --prefix=autoexpress-${{ steps.tag.outputs.tag }}/ HEAD > artifacts/autoexpress-${{ steps.tag.outputs.tag }}-source.zip
          git archive --format=tar.gz --prefix=autoexpress-${{ steps.tag.outputs.tag }}/ HEAD > artifacts/autoexpress-${{ steps.tag.outputs.tag }}-source.tar.gz
      
      - name: Download Windows Release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: artifacts/
      
      - name: Download Linux Release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AutoExpress ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          draft: false
          files: |
            artifacts/*
          generate_release_notes: false  # We're providing our own notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update latest release info
        if: steps.prerelease.outputs.prerelease == 'false'
        run: |
          echo "✅ Release ${{ steps.tag.outputs.tag }} created successfully!"
          echo "🎉 This is now the latest stable release of AutoExpress"
