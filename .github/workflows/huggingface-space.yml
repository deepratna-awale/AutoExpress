name: Hugging Face Space

# Publishes the standalone app on main to a Docker Space. Needs an HF_TOKEN
# secret (a Hugging Face token with write access) and, optionally, an
# HF_SPACE variable naming the Space (defaults to damientheodore/AutoExpress).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'damientheodore/AutoExpress' }}
    steps:
      - name: Check for a token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN is not set, so the Space is not updated."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.token.outputs.set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.token.outputs.set
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Stage the Space
        if: steps.token.outputs.set
        run: |
          mkdir "$RUNNER_TEMP/space"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/space"
          cd "$RUNNER_TEMP/space"
          # The Space README carries its settings; the rest isn't needed to run the app
          mv space/README.md README.md
          rm -rf space .github docs tests example_workflows
          # Bake the background removal models into the image, so they aren't fetched after every restart
          sed -i 's/^ARG PRELOAD_REMBG_MODELS=""/ARG PRELOAD_REMBG_MODELS="isnet-anime u2net_human_seg"/' Dockerfile
          grep -q '^ARG PRELOAD_REMBG_MODELS="isnet-anime' Dockerfile

      - name: Upload to the Space
        if: steps.token.outputs.set
        run: |
          pip install "huggingface_hub==1.33.0"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              commit_message=f"Update to {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns="*",
          )
          print(f"https://huggingface.co/spaces/{space}")
          PY
