[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoexpress"
description = "Generate 28 facial expressions of a character from one image. Works as a standalone app, an AUTOMATIC1111/Forge/SD.Next extension, ComfyUI nodes and InvokeAI nodes."
version = "2.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Only what the shared core needs. Every supported WebUI already ships these.
dependencies = ["pillow", "requests"]

classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/deepratna-awale/AutoExpress"
Documentation = "https://github.com/deepratna-awale/AutoExpress#readme"
"Bug Tracker" = "https://github.com/deepratna-awale/AutoExpress/issues"

[tool.setuptools]
packages = ["autoexpress_core", "autoexpress_core.backends"]

[tool.setuptools.package-data]
autoexpress_core = ["resources/*.json", "resources/expressions/*.json"]

# Comfy Registry metadata. .github/workflows/publish-comfy-registry.yml publishes
# a new version whenever `version` above changes on main. Files listed in
# .comfyignore are left out of the published archive.
[tool.comfy]
PublisherId = "deepratna-awale"
DisplayName = "AutoExpress"
Icon = "https://raw.githubusercontent.com/deepratna-awale/AutoExpress/main/autoexpress_core/resources/icon.png"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
