[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoexpress"
description = "Generate 28 facial expressions of a character from one image. Works as a standalone app, an AUTOMATIC1111/Forge/SD.Next extension, ComfyUI nodes and InvokeAI nodes."
version = "2.2.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
# Only what the shared core needs. Every supported WebUI already ships these, and
# they're all the WebUI extension and nodes (and the Comfy Registry) install.
dependencies = ["pillow", "requests"]

[project.optional-dependencies]
# The standalone app (Python 3.11+): install.sh / install.bat, the release zips and the Docker
# image install these from uv.lock, which pins every package for each platform.
standalone = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "sd-parsers==0.6",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "loguru>=0.7.3",
    # Production server for "python -m autoexpress"
    "waitress>=3.0.2",
    # Optional: live step progress from ComfyUI
    "websocket-client>=1.9.2",
    # "Remove background" on exports (the rembg models download on first use).
    # onnxruntime has no Intel macOS wheels, so it's left out there and the option is hidden.
    "rembg[cpu]>=2.0.82; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest"]

# The WebUI extension and nodes still run on Python 3.10 (with the WebUI's own
# Pillow), but the standalone app needs 3.11+: Pillow 13 and the patched rembg
# releases have dropped 3.10. uv.lock only resolves for 3.11+.
[tool.uv]
environments = ["python_full_version >= '3.11'"]


[project.urls]
Repository = "https://github.com/deepratna-awale/AutoExpress"
Documentation = "https://github.com/deepratna-awale/AutoExpress#readme"
"Bug Tracker" = "https://github.com/deepratna-awale/AutoExpress/issues"

[tool.setuptools]
packages = ["autoexpress_core", "autoexpress_core.backends"]

[tool.setuptools.package-data]
autoexpress_core = ["resources/*.json", "resources/expressions/*.json"]

# Comfy Registry metadata. .github/workflows/publish-comfy-registry.yml publishes
# a new version whenever `version` above changes on main. Files listed in
# .comfyignore are left out of the published archive.
[tool.comfy]
PublisherId = "deepratna-awale"
DisplayName = "AutoExpress"
Icon = "https://raw.githubusercontent.com/deepratna-awale/AutoExpress/main/autoexpress_core/resources/icon.png"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
